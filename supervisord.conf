[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
priority=10

[program:hermes-web]
command=python3 -m http.server 9119 --directory /data/workspaces
autorestart=true
priority=20
directory=/data

[program:antigravity-daemon]
command=/usr/local/bin/agy remote-control serve
autorestart=true
priority=30
directory=/data
environment=HOME="/data"
